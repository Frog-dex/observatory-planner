<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;font-family:'Playfair Display',Georgia,serif}
#gl{position:fixed;inset:0;display:block}
/* SIGNALSCOPE handheld twin-lens HUD (Blu loves this — unchanged) */
#scope{position:fixed;inset:0;pointer-events:none;z-index:2;transform-origin:50% 47%;will-change:opacity,transform}
#scope svg{width:100%;height:100%;display:block}
.hudtxt{font-family:'Playfair Display',Georgia,serif}
.logo{position:fixed;left:50%;top:10%;transform:translateX(-50%);text-align:center;color:#f0dca0;z-index:3;pointer-events:none;
  text-shadow:0 0 22px rgba(202,168,106,.7),0 2px 4px #000;transition:opacity .5s}
.logo h1{margin:0;font-size:clamp(26px,5.4vw,60px);font-weight:800;letter-spacing:3px}
.logo .sub{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#9fb6d8;opacity:.85;margin-top:6px}
.hud{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.hud .lbl{color:#caa86a;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
#prog{width:min(620px,88vw);accent-color:#caa86a}
.hint{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);z-index:3;color:#a9926a;font-size:13px;letter-spacing:.08em;transition:opacity .5s}
/* side controls */
.side{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px}
.side button{font-family:'Playfair Display',Georgia,serif;background:rgba(8,7,15,.72);color:#caa86a;border:1px solid #6a4f2c;
  border-radius:8px;padding:9px 12px;font-size:12px;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(3px);white-space:nowrap}
.side button.on{color:#7CF5C8;border-color:#3f7d6a;box-shadow:0 0 12px rgba(124,245,200,.25)}
.side a{font-family:'Playfair Display',Georgia,serif;background:rgba(8,7,15,.72);color:#caa86a;border:1px solid #6a4f2c;text-decoration:none;text-align:center;
  border-radius:8px;padding:9px 12px;font-size:12px;letter-spacing:.12em;backdrop-filter:blur(3px);white-space:nowrap}
@media (max-width:640px){
  .side{top:auto;bottom:86px;right:50%;transform:translateX(50%);flex-direction:row;gap:6px}
  .side button,.side a{padding:7px 9px;font-size:11px;letter-spacing:.06em}
  .hint{bottom:132px;width:90vw;text-align:center;font-size:12px}
}
</style></head>

<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/jsm/" } }</script>
<script type="module">
// Three.js r150+ no longer ships the global three.min.js build, so this page is an ES module now.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { texMat, loadInto } from './js/textures.js';
var FAC=[0xe76f51,0x2a9d8f,0x3f7d3a,0xd99000,0x4a6d8c,0x8a4fbd,0xc8a046];
var TWO_PI=Math.PI*2;
function clamp(x){ return x<0?0:x>1?1:x; }
function smooth01(x){ x=clamp(x); return x*x*(3-2*x); }
function lerp(a,b,t){ return a+(b-a)*t; }

var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(30,1,0.5,9000);
function size(){ renderer.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize',size); size();

var TL=new THREE.TextureLoader();

/* ---------- SKY: stars + Big Dipper + 12 zodiacs (group, hidden once shut) ---------- */
var sky=new THREE.Group(); scene.add(sky);
function rdir(){ var u=Math.random()*2-1, t=Math.random()*TWO_PI, s=Math.sqrt(1-u*u); return new THREE.Vector3(s*Math.cos(t),u,s*Math.sin(t)); }
var sp=[]; for(var i=0;i<2200;i++){ var v=rdir(), R=1700+Math.random()*600; sp.push(v.x*R,v.y*R,v.z*R); }
var sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
sky.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xdfe7ff,size:6,sizeAttenuation:true,transparent:true,opacity:.9})));
function tangent(dir){ var up=Math.abs(dir.y)>0.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
  var u=new THREE.Vector3().crossVectors(up,dir).normalize(), v=new THREE.Vector3().crossVectors(dir,u).normalize(); return [u,v]; }
function constellation(dir,lay,edges,scale,col,big){
  var b=tangent(dir), u=b[0], v=b[1], R=1650, pts=lay.map(function(p){
    return dir.clone().multiplyScalar(R).add(u.clone().multiplyScalar(p[0]*scale)).add(v.clone().multiplyScalar(p[1]*scale)); });
  var lpos=[]; edges.forEach(function(e){ var a=pts[e[0]],b2=pts[e[1]]; lpos.push(a.x,a.y,a.z,b2.x,b2.y,b2.z); });
  var lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(lpos,3));
  sky.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:big?.9:.6})));
  var np=[]; pts.forEach(function(p){ np.push(p.x,p.y,p.z); });
  var ng=new THREE.BufferGeometry(); ng.setAttribute('position',new THREE.Float32BufferAttribute(np,3));
  sky.add(new THREE.Points(ng,new THREE.PointsMaterial({color:big?0xfff6dc:0xeaf1ff,size:big?22:15,sizeAttenuation:true})));
}
// Big Dipper high near the zenith
var DIP=[[0,0],[0,1.05],[1.25,1.18],[1.32,.18],[2.35,-.02],[3.25,-.32],[4.15,-.95]];
var DIPE=[[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]];
constellation(new THREE.Vector3(0.18,1,0.05).normalize(),DIP,DIPE,150,0xf0dca0,true);
// 12 zodiacs ringed at a high elevation so a yaw sweep parades them all
for(var z=0;z<12;z++){ var az=z/12*TWO_PI, el=0.86;
  var dir=new THREE.Vector3(Math.cos(az)*Math.cos(el),Math.sin(el),Math.sin(az)*Math.cos(el)).normalize();
  function rng(s){ return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
  var r=rng(31+z*7), n=4+((r()*3)|0), lay=[], ed=[]; var k;
  for(k=0;k<n;k++) lay.push([(r()*2-1),(r()*1.5-.7)]); for(k=0;k<n-1;k++) ed.push([k,k+1]); if(r()>.5&&n>3) ed.push([0,n-1]);
  constellation(dir,lay,ed,150,FAC[z%7],false); }

/* ---------- OBSERVATORY ROOF: dome backdrop + two shutter doors that close ---------- */
var gates=new THREE.Group(); scene.add(gates);
var APR=0.22;                                                    // aperture half-angle at the dome apex
var domeMat=texMat('images/obs-dome.png',0x2a2018,{side:THREE.BackSide,transparent:true,opacity:0,gen:'dome'});
var dome=new THREE.Mesh(new THREE.SphereGeometry(660,56,30,0,TWO_PI,APR,Math.PI/2-APR+0.02),domeMat);
gates.add(dome);                                                 // curved brass observatory dome, hole at the top
var irisMat=texMat('images/obs-doors.png',0x3a2a14,{side:THREE.DoubleSide,transparent:true,opacity:0,gen:'doors'});
var iris=new THREE.Mesh(new THREE.CircleGeometry(660*Math.sin(APR)+22,48),irisMat);
iris.rotation.x=Math.PI/2; iris.position.y=660*Math.cos(APR)-4; gates.add(iris);   // disc that irises the aperture shut

/* ---------- THE SHAFT (enclosed copper tunnel — camera stays INSIDE, no black bleed) ---------- */
var shaftMat=new THREE.MeshBasicMaterial({color:0xb8763a,side:THREE.BackSide});
var SHAFT_TOP=150, SHAFT_BOT=-1430;
var shaft=new THREE.Mesh(new THREE.CylinderGeometry(150,150,SHAFT_TOP-SHAFT_BOT,48,1,true),shaftMat);
shaft.position.y=(SHAFT_TOP+SHAFT_BOT)/2; scene.add(shaft);
loadInto(shaftMat,'images/tunnel-copper-sm.jpg','copper',[7,16]);
// ladder down the shaft (he climbs down — no levitation), against the -z wall so you look down past it
var ladder=new THREE.Group(); scene.add(ladder);
var ladMat=new THREE.MeshBasicMaterial({color:0x241a10}), LZ=-120;
[-28,28].forEach(function(rx){ var rail=new THREE.Mesh(new THREE.BoxGeometry(9,SHAFT_TOP-SHAFT_BOT,9),ladMat); rail.position.set(rx,(SHAFT_TOP+SHAFT_BOT)/2,LZ); ladder.add(rail); });
for(var ry=SHAFT_TOP-50; ry>SHAFT_BOT+40; ry-=66){ var rung=new THREE.Mesh(new THREE.BoxGeometry(64,8,8),ladMat); rung.position.set(0,ry,LZ); ladder.add(rung); }

/* ---------- THE ROOM (Victorian observatory, textured, side-view diorama) ---------- */
var FLOORY=-1790, CEILY=-1430, BACKZ=-720, SIDEX=820, FRONTZ=520;
var room=new THREE.Group(); scene.add(room);
function quad(w,h,mat,rx,ry,x,y,z){ var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.rotation.x=rx||0; m.rotation.y=ry||0; m.position.set(x,y,z); room.add(m); return m; }
var matStone=texMat('images/obs-stone.png',0x20242b,{side:THREE.DoubleSide,rep:[2,2],gen:'stone'});            // stone base (tiles, expandable)
var matWall2=texMat('images/obs-wall2.png',0x241a12,{side:THREE.DoubleSide,gen:'wall2'});                      // hero wall: porthole + gauges
var matWallP=function(){ return texMat('images/obs-wall.png',0x241a12,{side:THREE.DoubleSide,gen:'wallPlain'}); }; // plain brass side walls
var matCeil =texMat('images/obs-dome.png',0x1d160f,{side:THREE.DoubleSide,gen:'dome'});
var matWood =texMat('images/obs-wood.png',0x4a331b,{side:THREE.DoubleSide,gen:'wood'});
quad(SIDEX*2,BACKZ*-1+FRONTZ, matStone, -Math.PI/2,0, 0,FLOORY,(BACKZ+FRONTZ)/2);                 // stone floor
// brass compass inlay — VECTOR art (crisp at any size), textured + laid over the stone
var compass=new THREE.Mesh(new THREE.PlaneGeometry(980,980),texMat('images/compass.png',0xffffff,{side:THREE.DoubleSide,transparent:true,gen:'compass'}));
compass.rotation.x=-Math.PI/2; compass.position.set(0,FLOORY+1.5,-120); room.add(compass);
quad(SIDEX*2,BACKZ*-1+FRONTZ, matCeil,  Math.PI/2,0, 0,CEILY,(BACKZ+FRONTZ)/2);                    // ceiling/roof
quad(SIDEX*2,CEILY-FLOORY, matWall2, 0,0, 0,(FLOORY+CEILY)/2,BACKZ);                               // back wall (hero porthole)
quad(FRONTZ-BACKZ,CEILY-FLOORY, matWallP(), 0,Math.PI/2, -SIDEX,(FLOORY+CEILY)/2,(BACKZ+FRONTZ)/2);// left wall
quad(FRONTZ-BACKZ,CEILY-FLOORY, matWallP(), 0,-Math.PI/2, SIDEX,(FLOORY+CEILY)/2,(BACKZ+FRONTZ)/2);// right wall
// hatch in the ceiling where the shaft drops in
var hatch=new THREE.Mesh(new THREE.CircleGeometry(170,40),texMat('images/obs-hatch.png',0x3a2a18,{side:THREE.DoubleSide,gen:'hatch'}));
hatch.rotation.x=Math.PI/2; hatch.position.set(0,CEILY-2,40); room.add(hatch);

// desk with little legs
function box(w,h,d,x,y,z,c){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c})); m.position.set(x,y,z); room.add(m); return m; }
var DESKY=FLOORY+150;
function boxM(w,h,d,x,y,z,mat){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); room.add(m); return m; }
boxM(520,26,250, 0,DESKY,-470, matWood);                   // desk top (wood)
boxM(480,90,14, 0,DESKY-70,-360, matWood);                 // modesty panel (wood)
[[-230,-380],[230,-380],[-230,-560],[230,-560]].forEach(function(p){ box(22,150,22, p[0],FLOORY+75,p[1], 0x2f2110); }); // little legs

/* ---------- ROUNDED CRT TV on a rotating pivot (no antennas, angled, smaller) ---------- */
function rr(w,h,r){ var s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
var tvPivot=new THREE.Group(); tvPivot.position.set(0,DESKY+78,-470); room.add(tvPivot);
var cabinet=new THREE.Mesh(new THREE.ExtrudeGeometry(rr(176,138,30),{depth:120,bevelEnabled:true,bevelThickness:14,bevelSize:14,bevelSegments:3}),
  matWood);
cabinet.position.z=-60; tvPivot.add(cabinet);                       // wooden CRT cabinet, rounded
var screen=new THREE.Mesh(new THREE.ShapeGeometry(rr(140,104,22)),new THREE.MeshBasicMaterial({color:0x123a32}));
screen.position.z=78; tvPivot.add(screen);                          // rounded glass screen
var screenGlow=new THREE.Mesh(new THREE.ShapeGeometry(rr(150,114,26)),new THREE.MeshBasicMaterial({color:0x6a4f2c}));
screenGlow.position.z=77.4; tvPivot.add(screenGlow);                // brass screen frame just behind glass
[[78,30],[78,-2]].forEach(function(p){ var k=new THREE.Mesh(new THREE.CylinderGeometry(7,7,12,16),new THREE.MeshBasicMaterial({color:0x6a4f2c}));
  k.rotation.x=Math.PI/2; k.position.set(p[0],p[1],80); tvPivot.add(k); });   // brass knobs, right side

// lizard host cutout (faces the camera; sits to the side of the terminal)
var lizardMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0});
var lizard=new THREE.Mesh(new THREE.PlaneGeometry(210,274),lizardMat);
lizard.position.set(250,DESKY+90,-430); room.add(lizard);
TL.load('images/lizard.png',function(t){ t.colorSpace=THREE.SRGBColorSpace; lizardMat.map=t; lizardMat.opacity=1; lizardMat.needsUpdate=true; },undefined,function(){
  // no cut-out art in this checkout → stand the real lizard model in the same spot, lit just for itself
  room.add(new THREE.HemisphereLight(0xfff1d6,0x2a1c10,2.4));
  new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('models/lizard.glb',function(g){
    var o=g.scene, b=new THREE.Box3().setFromObject(o), sz=new THREE.Vector3(); b.getSize(sz);
    o.scale.setScalar(230/Math.max(1e-3,sz.y)); o.rotation.y=-0.5; o.updateMatrixWorld(true);
    b=new THREE.Box3().setFromObject(o); var c=new THREE.Vector3(); b.getCenter(c);
    o.position.set(o.position.x+250-c.x, o.position.y+FLOORY-b.min.y, o.position.z-430-c.z); room.add(o);
  });
});

/* ---------- CAMERA PATH (one continuous pan, vertical: stars → doors → shaft → room) ---------- */
var PATH=[
 {p:0.00, pos:[0,0,0],          tgt:[0,300,0]},
 {p:0.40, pos:[0,0,0],          tgt:[0,300,0]},
 {p:0.50, pos:[0,-80,30],       tgt:[0,-380,-150]},
 {p:0.56, pos:[0,-380,30],      tgt:[0,-780,-150]},
 {p:0.82, pos:[0,-1230,30],     tgt:[0,-1560,-150]},
 {p:0.90, pos:[0,-1500,60],     tgt:[0,-1640,-260]},
 {p:0.96, pos:[0,-1600,320],    tgt:[0,-1620,-360]},
 {p:1.00, pos:[0,-1604,360],    tgt:[0,-1618,-380]}
];
function v3at(arr,key,p){ for(var i=0;i<arr.length-1;i++){ if(p<=arr[i+1].p){ var s=smooth01((p-arr[i].p)/(arr[i+1].p-arr[i].p||1));
  var A=arr[i][key],B=arr[i+1][key]; return new THREE.Vector3(lerp(A[0],B[0],s),lerp(A[1],B[1],s),lerp(A[2],B[2],s)); } }
  var L=arr[arr.length-1][key]; return new THREE.Vector3(L[0],L[1],L[2]); }

/* ---------- CONTROLS ---------- */
var prog=0, dragYaw=0, dragPitch=0, dragging=false, lx=0, ly=0, T=0, freelook=false;
var slider=document.getElementById('prog'), scope=document.getElementById('scope'), logo=document.getElementById('logo'),
    hint=document.getElementById('hint'), stageEl=document.getElementById('stage'),
    radar=document.getElementById('radar'), needle=document.getElementById('needle'), freq=document.getElementById('freq'),
    freebtn=document.getElementById('freebtn'), replaybtn=document.getElementById('replaybtn');
slider.oninput=function(){ prog=slider.value/1000; };
function nudge(d){ prog=clamp(prog+d); slider.value=prog*1000; }
addEventListener('wheel',function(e){ nudge(e.deltaY>0?0.011:-0.011); },{passive:true});
var ty=null;
addEventListener('touchstart',function(e){ if(!freelook&&e.target===gl) ty=e.touches[0].clientY; },{passive:true});
addEventListener('touchmove',function(e){ if(ty==null)return; var y=e.touches[0].clientY; nudge((ty-y)*0.0016); ty=y; },{passive:true});
addEventListener('touchend',function(){ ty=null; });
addEventListener('keydown',function(e){
  if(e.target===slider) return;
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); nudge(0.03); }
  else if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); nudge(-0.03); }
});
var gl=document.getElementById('gl');
gl.addEventListener('pointerdown',function(e){ if(!freelook)return; dragging=true; lx=e.clientX; ly=e.clientY; });
addEventListener('pointermove',function(e){ if(!dragging)return; dragYaw-=(e.clientX-lx)*0.0026; dragPitch-=(e.clientY-ly)*0.0026; dragPitch=Math.max(-0.9,Math.min(0.9,dragPitch)); lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup',function(){ dragging=false; });
freebtn.onclick=function(){ freelook=!freelook; freebtn.textContent=(freelook?'🔓 Free look: ON':'🔓 Free look: OFF'); freebtn.classList.toggle('on',freelook); if(!freelook){dragYaw=0;dragPitch=0;} };
replaybtn.onclick=function(){ prog=0; slider.value=0; };

var STAGES=[[0,'The Signalscope'],[0.24,'Sealing the dome'],[0.5,'Down the shaft'],[0.9,'The observatory']];
var U0=new THREE.Vector3(0,0,-1), U1=new THREE.Vector3(0,1,0), tmpU=new THREE.Vector3(), tmpD=new THREE.Vector3();
function render(){
  T+=0.016;
  var pos=v3at(PATH,'pos',prog);
  cam.position.copy(pos);
  // FOV: telescopic 30° through the scope, widens to 64° as you un-scope (COD-style)
  var fov=30+smooth01((prog-0.22)/0.16)*34;
  if(Math.abs(cam.fov-fov)>0.02){ cam.fov=fov; cam.updateProjectionMatrix(); }
  // up-vector: -z while vertical (looking up/down the shaft) → +y once standing in the room
  tmpU.copy(U0).lerp(U1,smooth01((prog-0.86)/0.10)).normalize(); cam.up.copy(tmpU);

  // aim: sweep across ALL constellations, then hold gaze UP to watch the dome shut, else follow the path
  if(prog<0.40 && !freelook){
    var sweep=clamp(prog/0.20);
    var el=lerp(1.30,0.86,smooth01(sweep)), az=TWO_PI*smooth01(sweep);     // start on the Dipper, spiral around the zodiac ring
    tmpD.set(Math.cos(az)*Math.cos(el),Math.sin(el),Math.sin(az)*Math.cos(el));
    var skyTgt=pos.clone().add(tmpD.clone().multiplyScalar(300));
    var upTgt=pos.clone().add(new THREE.Vector3(0,300,0));
    cam.lookAt(skyTgt.lerp(upTgt,smooth01((prog-0.20)/0.12)));            // return gaze straight up for the door close
  } else {
    cam.lookAt(v3at(PATH,'tgt',prog));
  }
  if(freelook){ cam.rotateY(dragYaw); cam.rotateX(dragPitch); }

  // SIGNALSCOPE: COD-style un-scope — the scope drops DOWN out of view (a lower, not a fade)
  var s=smooth01((prog-0.22)/0.10);
  scope.style.transform='translateY('+(s*120).toFixed(1)+'%) scale('+(1+0.12*s)+') rotate('+(s*-3).toFixed(1)+'deg)';
  scope.style.opacity = s<0.72?1:Math.max(0,1-(s-0.72)/0.28);
  radar.setAttribute('transform','rotate('+((T*52)%360)+' 150 150)');
  needle.setAttribute('transform','translate('+(Math.sin(T*0.5)*70).toFixed(1)+',0)');
  freq.textContent=(88.7+Math.sin(T*0.5)*0.6).toFixed(1);

  // observatory DOME irises shut over you while you watch (curved dome, no black sky bleed)
  var shut=smooth01((prog-0.24)/0.12);              // aperture iris closes
  var op=smooth01((prog-0.20)/0.10);                // brass dome fades into view
  domeMat.opacity=op; irisMat.opacity=op;
  var sc=lerp(0.05,1,shut); iris.scale.set(sc,sc,sc);
  gates.visible=prog>0.18 && prog<0.58;
  sky.visible=prog<0.52;
  shaft.visible=prog>0.42;                          // shaft only exists for the descent → clean stars above
  ladder.visible=prog>0.42 && prog<0.93;            // the ladder you climb down

  // TV swivels from facing-the-lizard to facing-you as you arrive
  tvPivot.rotation.y=lerp(-2.05,-0.12,smooth01((prog-0.9)/0.1));

  logo.style.opacity=prog>0.06?0:1; hint.style.opacity=prog>0.05?0:1;
  var st=STAGES[0][1]; for(var i=0;i<STAGES.length;i++) if(prog>=STAGES[i][0]) st=STAGES[i][1]; stageEl.textContent=st;
  renderer.render(scene,cam);
  requestAnimationFrame(render);
}
render();
var m=/[?&]p=(\d+)/.exec(location.search); if(m){ prog=(+m[1])/100; slider.value=prog*1000; }
</script>
</body></html>
